# The Kubernetes version `cargo check`/`doc` compile k8s-openapi for: the
# kit's libraries enable no `v1_*` feature (RFC 0005). The same version as
# the tests' dev-dependency, so the two never conflict.
[env]
K8S_OPENAPI_ENABLED_VERSION = "1.36"

[tools]
cocogitto = "latest"
rust = { version = "latest", components = ["rust-src", "rustfmt", "llvm-tools", "clippy"], profile = "default" }
task = "latest"
gitleaks = "latest"
rtk = "latest"
"pipx:graphifyy" = "latest"
# `task audit`
"aqua:EmbarkStudios/cargo-deny" = "latest"
trivy = "latest"
# envtest (crates/weebo-kit-testkit): Go for its build-time bindings
go = "latest"
etcd = "3.5.32"
"aqua:kubernetes/kubernetes/kube-apiserver" = "1.36.2"
actionlint = "latest"
# packages/operator-docs (`task docs:check`, `task docs:pack`)
node = "24"
shellcheck = "latest"
# charts/weebo-operator-lib (`task chart:check`, the release's OCI push)
helm = "latest"
# templates/operator (`task template:render`)
"ubi:cargo-generate/cargo-generate" = "latest"
"github:batleforc/weebo-skillsagent" = "v0.12.0"
