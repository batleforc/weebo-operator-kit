name: Publish

# A pushed release tag `vX.Y.Z` (a bump made locally with `cog bump`):
# weebo-operator-kit's publish workflow — the image of each variant (Red Hat
# Hummingbird, and a statically linked one as `-static`), scanned by Grype
# (accepted findings: .grype.yaml), smoke-run, signed; the chart (OCI); the
# GitHub Release. The static variant is optional: a failure there leaves it
# out of the release instead of blocking it.
#
# Images are amd64. `arm64: true` adds a separate arm64 image per variant
# (`vX.Y.Z-arm64`, `vX.Y.Z-static-arm64`), built natively, never a gate.
#
# The chart is named after the repository, the image after the repository
# with `-operator`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) to (re)publish.
        required: true
        type: string

permissions: {}

jobs:
  publish:
    uses: batleforc/weebo-operator-kit/.github/workflows/publish.yml@v0.14.2
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      image: ghcr.io/${{ github.repository }}-operator
      chart: ${{ github.event.repository.name }}
      variants: >-
        [{"file": "Containerfile", "suffix": "", "required": true},
         {"file": "Containerfile.static", "suffix": "-static", "required": false}]
      smoke-entrypoint: /usr/local/bin/operator
      smoke-args: --version
      arm64: false
