[workspace]
resolver = "2"
members = [
    "crates/weebo-kit-domain",
    "crates/weebo-kit-api",
    "crates/weebo-kit-application",
    "crates/weebo-kit-adapters",
    "crates/weebo-kit-runtime",
    "crates/weebo-kit-testkit",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/batleforc/weebo-operator-kit"

[workspace.dependencies]
weebo-kit-domain = { path = "crates/weebo-kit-domain" }
weebo-kit-api = { path = "crates/weebo-kit-api" }
weebo-kit-application = { path = "crates/weebo-kit-application" }
weebo-kit-adapters = { path = "crates/weebo-kit-adapters" }
weebo-kit-runtime = { path = "crates/weebo-kit-runtime" }

# Same versions as the operators using the kit: a mismatch would link two
# copies of `kube`/`k8s-openapi` and the types wouldn't line up.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
kube = { version = "4.0", features = ["derive", "runtime", "client"] }
k8s-openapi = { version = "0.28", features = ["v1_36", "schemars"] }
schemars = "1.2"
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = [
    "tls-rustls-no-provider",
] }
rustls = { version = "0.23", features = ["ring"] }
vaultrs = "0.8"
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", features = ["trace", "metrics"] }
tracing-opentelemetry = "0.34"
opentelemetry-prometheus = "0.33"
prometheus = { version = "0.14", default-features = false }
anyhow = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
envtest = "0.3"
sha2 = "0.10"

[profile.test]
debug = false
