name: Release

# On a version tag: packs packages/operator-docs and attaches the tarball to
# the tag's GitHub Release (created when missing). That tarball is how the
# operators' docs sites consume the package:
#   "@weebo/operator-docs": "https://github.com/batleforc/weebo-operator-kit/releases/download/vX.Y.Z/weebo-operator-docs-X.Y.Z.tgz"
# It also pushes the library chart (charts/weebo-operator-lib) to
# oci://ghcr.io/batleforc/charts, where the operators' charts depend on it:
#   dependencies:
#     - { name: weebo-operator-lib, version: X.Y.Z, repository: oci://ghcr.io/batleforc/charts }
# keyless-signed with cosign (this workflow's identity), which publish.yml
# verifies before packaging an operator's chart on it.
# The crates need nothing here: operators depend on them by git tag, and
# on tasks/ and the reusable workflows by the tag's URLs.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  operator-docs:
    runs-on: ubuntu-latest
    permissions:
      # Creates the release and uploads the asset.
      contents: write
    env:
      # `mise exec` would install every tool of mise.toml it finds missing,
      # through GitHub's API, unauthenticated: a shared runner's rate limit
      # failed the v0.18.0 release. Only node and task are installed, and
      # mise's API calls are authenticated.
      MISE_EXEC_AUTO_INSTALL: "false"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      # Only what the package needs, not the Rust/Go toolchain.
      - run: mise install node task
      - run: mise exec -- task docs:check
      - run: mise exec -- task docs:pack
      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Named after package.json's version: a tag it doesn't match fails here.
          asset="dist/weebo-operator-docs-${TAG#v}.tgz"
          test -f "$asset"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" "$asset" --clobber

  library-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pushes the chart to ghcr.io.
      packages: write
      # Keyless cosign signature of the pushed chart.
      id-token: write
    env:
      # `mise exec` would install every tool of mise.toml it finds missing,
      # through GitHub's API, unauthenticated: a shared runner's rate limit
      # failed the v0.23.0 release (library chart). Only what the job
      # installs is used, and mise's API calls are authenticated.
      MISE_EXEC_AUTO_INSTALL: "false"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      - run: mise install helm
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Chart version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(awk '/^version:/ {print $2}' charts/weebo-operator-lib/Chart.yaml)"
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error::charts/weebo-operator-lib is $version, the tag says ${TAG#v} (.hooks/bump-versions.sh)" >&2
            exit 1
          fi
      - name: Package and push
        id: push
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | mise exec -- helm registry login ghcr.io -u "$ACTOR" --password-stdin
          mise exec -- helm lint charts/weebo-operator-lib
          mkdir -p dist
          mise exec -- helm package charts/weebo-operator-lib --destination dist
          out="$(mise exec -- helm push dist/weebo-operator-lib-*.tgz oci://ghcr.io/batleforc/charts 2>&1)"
          echo "$out"
          digest="$(printf '%s\n' "$out" | awk '/^Digest:/ {print $2}')"
          [ -n "$digest" ] || { echo "::error::no digest in helm push output" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # A tag is mutable: the operators' publish verifies this signature
      # before building their chart on the library.
      - name: Sign the chart with cosign
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REF: ghcr.io/batleforc/charts/weebo-operator-lib@${{ steps.push.outputs.digest }}
        run: |
          echo "$TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin
          cosign sign --yes "$REF"
