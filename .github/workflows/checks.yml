name: Checks

# Reusable: the checks every weebo operator runs on each push and pull
# request — `task lint`, `task test`, `task audit`, and the chart's lint
# when it has one — each in its own job:
#
#   on:
#     push: { branches: [main] }
#     pull_request:
#   permissions: {}
#   jobs:
#     checks:
#       uses: batleforc/weebo-operator-kit/.github/workflows/checks.yml@vX.Y.Z
#       permissions: { contents: read }
#       with: { test-task: "test:all", helm-task: "lint:helm" }
#
# Operator-specific jobs (coverage against the real remote system, image
# builds, regenerated files) stay in the operator's own workflow, next to
# this call.
#
# Expected from the caller's repository: `.github/actions/setup-mise`, and
# the tasks named by the inputs (the cog.toml contract: lint, test, audit).
# GitHub Actions syntax kept compatible with Forgejo Actions: no
# marketplace action without a Forgejo equivalent, every tool comes from
# the caller's mise.toml.
on:
  workflow_call:
    inputs:
      lint-task:
        description: "Lint task (fmt, clippy, actionlint...)"
        type: string
        default: lint
      test-task:
        description: "Test task (`test:all` to include the envtest integration tests)"
        type: string
        default: test
      audit-task:
        description: "Audit task (cargo-deny, trivy, npm audit)"
        type: string
        default: audit
      helm-task:
        description: "Chart lint task (`lint:helm`); empty skips the job"
        type: string
        default: ""
      free-disk-space:
        description: "Remove the runner's unused toolchains first: an envtest-backed workspace has run out of disk on the default runner"
        type: boolean
        default: true

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Free disk space
        if: inputs.free-disk-space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
      - uses: ./.github/actions/setup-mise
      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      # clippy --all-targets builds the testkit's envtest, whose bindgen
      # step needs libclang.
      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          # libclang-dev is a transitional package on current runners:
          # find the real file instead of trusting `dpkg -L`.
          LIBCLANG_SO="$(find /usr/lib -iname 'libclang.so*' 2>/dev/null | head -n1)"
          if [ -z "$LIBCLANG_SO" ]; then
            echo "::error::libclang.so not found after installing libclang-dev" >&2
            exit 1
          fi
          {
            echo "LIBCLANG_PATH=$(dirname "$LIBCLANG_SO")"
            echo "BINDGEN_EXTRA_CLANG_ARGS="
          } >> "$GITHUB_ENV"
      # Authenticated: unauthenticated, mise's GitHub API calls hit a shared
      # runner's rate limit (a 403 installing cargo-generate failed a run).
      # The token only reaches this step; `mise exec` installs nothing more.
      - run: mise install
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise exec -- task "$TASK"
        env:
          MISE_EXEC_AUTO_INSTALL: "false"
          TASK: ${{ inputs.lint-task }}

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Free disk space
        if: inputs.free-disk-space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
      - uses: ./.github/actions/setup-mise
      # target/ is deliberately not cached: keyed on Cargo.lock only, it
      # never gets evicted and grows until the runner runs out of disk.
      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          LIBCLANG_SO="$(find /usr/lib -iname 'libclang.so*' 2>/dev/null | head -n1)"
          if [ -z "$LIBCLANG_SO" ]; then
            echo "::error::libclang.so not found after installing libclang-dev" >&2
            exit 1
          fi
          {
            echo "LIBCLANG_PATH=$(dirname "$LIBCLANG_SO")"
            echo "BINDGEN_EXTRA_CLANG_ARGS="
          } >> "$GITHUB_ENV"
      # Authenticated: unauthenticated, mise's GitHub API calls hit a shared
      # runner's rate limit (a 403 installing cargo-generate failed a run).
      # The token only reaches this step; `mise exec` installs nothing more.
      - run: mise install
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise exec -- task "$TASK"
        env:
          MISE_EXEC_AUTO_INSTALL: "false"
          TASK: ${{ inputs.test-task }}

  # Same gate as cog's pre-commit and pre-bump hooks: no known CVE.
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      # Authenticated: unauthenticated, mise's GitHub API calls hit a shared
      # runner's rate limit (a 403 installing cargo-generate failed a run).
      # The token only reaches this step; `mise exec` installs nothing more.
      - run: mise install
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise exec -- task "$TASK"
        env:
          MISE_EXEC_AUTO_INSTALL: "false"
          TASK: ${{ inputs.audit-task }}

  helm:
    if: inputs.helm-task != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      # Authenticated: unauthenticated, mise's GitHub API calls hit a shared
      # runner's rate limit (a 403 installing cargo-generate failed a run).
      # The token only reaches this step; `mise exec` installs nothing more.
      - run: mise install
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise exec -- task "$TASK"
        env:
          MISE_EXEC_AUTO_INSTALL: "false"
          TASK: ${{ inputs.helm-task }}
