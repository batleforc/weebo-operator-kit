version: "3"

includes:
  mise: ./.tasks/mise.yaml
  # The shared tasks the operators include remotely (tasks/), included
  # here from the working tree.
  rust: ./tasks/rust.yaml
  repo:
    taskfile: ./tasks/repo.yaml
    vars:
      NPM_DIR: packages/operator-docs
  helm:
    taskfile: ./tasks/helm.yaml
    vars:
      CHART: "{{.TEMPLATE_OUT}}/deploy/charts/weebo-example"
      CRD_DIR: "{{.TEMPLATE_OUT}}/deploy/crd"
  # The operators' cog.toml template (templates/), rendered here too.
  kit:
    taskfile: ./templates/kit.yaml
    vars:
      KIT_DIR: "{{.ROOT_DIR}}"

vars:
  # Where `task template:render` writes the operator template, rendered
  # for a product named Example.
  TEMPLATE_OUT: "{{.ROOT_DIR}}/target/template/weebo-example"

env:
  LIBCLANG_PATH:
    sh: echo "${LIBCLANG_PATH-/usr/lib64}"
  BINDGEN_EXTRA_CLANG_ARGS:
    sh: echo "${BINDGEN_EXTRA_CLANG_ARGS--I/usr/lib/gcc/x86_64-redhat-linux/16/include -I/usr/include}"

tasks:
  init:
    desc: "Install the toolchain (mise) and the git hooks (cocogitto)"
    cmds:
      - task mise:install
      - cog install-hook -a -o

  doctor:
    desc: "Check the local dev setup needed by weebo-kit-testkit's envtest (Go, libclang, control-plane binaries), the template tools and the git hooks"
    cmds:
      - task: rust:doctor
        vars: { DOCTOR_TOOLS: "helm cargo-generate" }

  lint:
    desc: "cargo fmt --check + clippy -D warnings, actionlint, and the library chart through the operator template's chart"
    cmds:
      - task: rust:lint
      - task: repo:lint
      - task: chart:check

  test:
    desc: "Every kit test: unit, contract (Vault against wiremock) and doctests"
    cmds:
      - mise exec -- cargo test --workspace

  doc:
    desc: "Build the kit's rustdoc (what the operators program against)"
    cmds:
      - mise exec -- cargo doc --workspace --no-deps

  audit:
    desc: "Check dependencies for CVE (cargo-deny + trivy on Cargo.lock, npm audit on packages/operator-docs and site/)"
    cmds:
      - task: rust:audit
      # What the package brings into an operator's site; its dev tooling
      # (the peers it is type-checked against) is the operators' to audit.
      - task: repo:audit
      # What the kit's own site ships (from its lockfile, like repo:audit).
      - mise exec -- npm audit --prefix site --omit=dev --audit-level=high

  test:all:
    desc: "Every test, then the operator template rendered and built on this working tree (the release suite, before every tag)"
    cmds:
      - task: test
      - task: template:check

  chart:check:
    desc: "helm lint the library chart, then render the operator template's chart on it and run the shared helm:lint (smoke renders)"
    cmds:
      - mise exec -- helm lint charts/weebo-operator-lib
      - task: template:render
      - task: helm:lint
      # params.watchRules: in the watch Role of a watched namespace (even
      # without namespaced kinds), nowhere without one.
      - |
        set -eu
        chart="{{.TEMPLATE_OUT}}/deploy/charts/weebo-example"
        cp charts/testdata/watch-rules.yaml "$chart/templates/zz-watch-rules.yaml"
        trap 'rm -f "$chart/templates/zz-watch-rules.yaml"' EXIT
        out="$(mise exec -- helm template smoke "$chart" --set watch.namespace=team-a --set watch.clusterKinds=false --set crds.install=false --show-only templates/zz-watch-rules.yaml)"
        printf '%s\n' "$out" | grep -q '^  namespace: team-a$'
        printf '%s\n' "$out" | grep -q '^    - deployments$'
        out="$(mise exec -- helm template smoke "$chart")"
        if printf '%s\n' "$out" | grep -q 'deployments$'; then exit 1; fi
      # prometheusRule.repeatedDrift.enabled: RepeatedDrift by default, none
      # when false (an operator that counts no remote write).
      - |
        set -eu
        chart="{{.TEMPLATE_OUT}}/deploy/charts/weebo-example"
        on="--set metrics.prometheus.enabled=true --set prometheusRule.enabled=true"
        mise exec -- helm lint "$chart" $on --set prometheusRule.repeatedDrift.enabled=false > /dev/null
        out="$(mise exec -- helm template smoke "$chart" $on)"
        printf '%s\n' "$out" | grep -q 'alert: .*RepeatedDrift$'
        out="$(mise exec -- helm template smoke "$chart" $on --set prometheusRule.repeatedDrift.enabled=false)"
        if printf '%s\n' "$out" | grep -q 'RepeatedDrift'; then exit 1; fi
        printf '%s\n' "$out" | grep -q 'alert: .*ReconcileSlow$'

  template:render:
    desc: "Render templates/operator (cargo-generate) for a product named Example into TEMPLATE_OUT, wired on this working tree (kit crates and library chart by path)"
    cmds:
      - |
        set -eu
        out="{{.TEMPLATE_OUT}}"
        mkdir -p "$(dirname "$out")"
        find "$(dirname "$out")" -mindepth 1 -maxdepth 1 -name "$(basename "$out")" -exec rm -r {} +
        # Rendered outside the kit's tree, then moved: cargo-generate adds a
        # project generated inside a workspace to that workspace's members.
        tmp="$(mktemp -d)"
        mise exec -- cargo-generate generate --path templates/operator --name weebo-example \
          --define product=Example --destination "$tmp" --vcs none --silent
        mv "$tmp/weebo-example" "$out"
        rmdir "$tmp"
        # The tag the template pins is the next release, not yet
        # published: the working tree stands in for it.
        sed -i -E 's|^(weebo-kit-[a-z]+)( = \{ )git = "https://github.com/batleforc/weebo-operator-kit", tag = "[^"]*"|\1\2path = "{{.ROOT_DIR}}/crates/\1"|' "$out/Cargo.toml"
        if grep -q 'tag = "' "$out/Cargo.toml"; then echo "a kit dependency of the template is not in the expected form" >&2; exit 1; fi
        sed -i 's|repository: oci://ghcr.io/batleforc/charts|repository: file://{{.ROOT_DIR}}/charts/weebo-operator-lib|' "$out"/deploy/charts/*/Chart.yaml

  template:check:
    desc: "Render the operator template, then build, lint and test it (envtest included) and check its committed CRDs and chart are what it generates"
    deps: [template:render]
    vars:
      MANIFEST: "--manifest-path {{.TEMPLATE_OUT}}/Cargo.toml"
    env:
      # Its own target/, shared with nothing of the kit's build.
      CARGO_TARGET_DIR: "{{.ROOT_DIR}}/target/template/target"
    # Run from the kit (its mise.toml has every tool), on the rendered
    # workspace.
    cmds:
      # The template's copy of templates/kit.yaml is what a new operator
      # starts with: the same file.
      - diff templates/kit.yaml templates/operator/.tasks/kit.yaml
      - mise exec -- cargo fmt --all --check {{.MANIFEST}}
      - mise exec -- cargo clippy {{.MANIFEST}} --workspace --all-targets -- -D warnings
      - mise exec -- cargo test {{.MANIFEST}} --workspace --no-fail-fast
      - mise exec -- cargo run -q {{.MANIFEST}} -p crdgen -- --out {{.TEMPLATE_OUT}}/deploy/crd/
      - task: helm:crds
      - |
        # What crdgen and helm:crds just produced is what the template
        # commits: compared with a fresh render.
        out="{{.TEMPLATE_OUT}}"; generated="$(mktemp -d)"
        cp -r "$out/deploy" "$generated/"
        task template:render >/dev/null
        diff -r "$generated/deploy/crd" "$out/deploy/crd"
        diff -r -x charts -x Chart.lock "$generated/deploy/charts" "$out/deploy/charts"

  site:deps:
    desc: "Install the kit's documentation site's npm dependencies (site/), @weebo/operator-docs copied from packages/operator-docs; reinstalls when either changes"
    sources:
      - site/package.json
      - site/package-lock.json
      - packages/operator-docs/package.json
      - packages/operator-docs/next.mjs
      - packages/operator-docs/{bin,css,src}/**/*
    generates:
      - site/node_modules/.package-lock.json
    cmds:
      - mise exec -- npm ci --prefix site --no-fund --no-audit

  site:
    desc: "Run the kit's documentation site (site/) in dev mode (http://localhost:3000); re-run after changing packages/operator-docs"
    deps: [site:deps]
    dir: site
    cmds:
      - mise exec -- npm run dev

  site:build:
    desc: "Lint + static export of the kit's documentation site into site/out/ (DOCS_BASE_PATH for a sub-path)"
    deps: [site:deps]
    dir: site
    cmds:
      - mise exec -- npm run lint
      - mise exec -- npm run build

  docs:version:
    desc: "Fail when packages/operator-docs' version differs from the workspace's (its release tarball is named after it)"
    internal: true
    cmds:
      - |
        crate=$(awk '/^\[workspace\.package\]/{p=1;next} /^\[/{p=0} p && /^version = /{gsub(/"/,"",$3); print $3}' Cargo.toml)
        npm=$(mise exec -- node -p "require('./packages/operator-docs/package.json').version")
        if [ "$crate" != "$npm" ]; then
          echo "packages/operator-docs is $npm, the workspace is $crate — .hooks/bump-versions.sh $crate"
          exit 1
        fi

  docs:check:
    desc: "Check @weebo/operator-docs: version in step with the workspace, types against its pinned peers, lint, generator tests"
    dir: packages/operator-docs
    cmds:
      - task: docs:version
      - mise exec -- npm ci --no-fund --no-audit
      - mise exec -- npm run check
      - mise exec -- npm run lint

  docs:pack:
    desc: "Pack @weebo/operator-docs into dist/weebo-operator-docs-<version>.tgz, the release asset the operators' docs sites install"
    cmds:
      - task: docs:version
      - mkdir -p dist
      - mise exec -- npm pack ./packages/operator-docs --pack-destination dist
