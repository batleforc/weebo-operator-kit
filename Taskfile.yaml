version: "3"

includes:
  mise: ./.tasks/mise.yaml
  # The operators' cog.toml template (templates/), rendered here too.
  kit:
    taskfile: ./templates/kit.yaml
    vars:
      KIT_DIR: "{{.ROOT_DIR}}"

env:
  LIBCLANG_PATH:
    sh: echo "${LIBCLANG_PATH-/usr/lib64}"
  BINDGEN_EXTRA_CLANG_ARGS:
    sh: echo "${BINDGEN_EXTRA_CLANG_ARGS--I/usr/lib/gcc/x86_64-redhat-linux/16/include -I/usr/include}"

tasks:
  init:
    desc: "Install the toolchain (mise) and the git hooks (cocogitto)"
    cmds:
      - task mise:install
      - cog install-hook -a -o

  doctor:
    desc: "Check the local dev setup needed by weebo-kit-testkit's envtest (Go, libclang, control-plane binaries) and the git hooks"
    cmds:
      - |
        ok=true
        check() { if eval "$2" >/dev/null 2>&1; then echo "  [ok]   $1"; else echo "  [FAIL] $1 — $3"; ok=false; fi; }
        check "go"              "mise exec -- go version"                    "mise install"
        check "etcd"            "mise exec -- etcd --version"                "mise install"
        check "kube-apiserver"  "mise exec -- kube-apiserver --version"      "mise install"
        check "libclang.so"     "ls $LIBCLANG_PATH/libclang.so*"             "install clang-libs (or libclang-dev) and set LIBCLANG_PATH"
        test -f .git/hooks/pre-commit && echo "  [ok]   git hooks" || echo "  [warn] git hooks not installed — task init"
        $ok

  lint:
    desc: "cargo fmt --check + clippy -D warnings on the whole workspace, actionlint on CI"
    cmds:
      - mise exec -- cargo fmt --check
      - mise exec -- cargo clippy --workspace --all-targets -- -D warnings
      - mise exec -- actionlint

  test:
    desc: "Every kit test: unit, contract (Vault against wiremock) and doctests"
    cmds:
      - mise exec -- cargo test --workspace

  doc:
    desc: "Build the kit's rustdoc (what the operators program against)"
    cmds:
      - mise exec -- cargo doc --workspace --no-deps

  audit:
    desc: "Check dependencies for CVE (cargo-deny + trivy on Cargo.lock, npm audit on packages/operator-docs)"
    cmds:
      - mise exec -- cargo deny check
      - mise exec -- trivy fs --scanners vuln --exit-code 1 --severity HIGH,CRITICAL Cargo.lock
      # What the package brings into an operator's site; its dev tooling
      # (the peers it is type-checked against) is the operators' to audit.
      - mise exec -- npm audit --prefix packages/operator-docs --omit=dev --audit-level=high

  docs:version:
    desc: "Fail when packages/operator-docs' version differs from the workspace's (its release tarball is named after it)"
    internal: true
    cmds:
      - |
        crate=$(awk '/^\[workspace\.package\]/{p=1;next} /^\[/{p=0} p && /^version = /{gsub(/"/,"",$3); print $3}' Cargo.toml)
        npm=$(mise exec -- node -p "require('./packages/operator-docs/package.json').version")
        if [ "$crate" != "$npm" ]; then
          echo "packages/operator-docs is $npm, the workspace is $crate — .hooks/bump-versions.sh $crate"
          exit 1
        fi

  docs:check:
    desc: "Check @weebo/operator-docs: version in step with the workspace, types against its pinned peers, generator tests"
    dir: packages/operator-docs
    cmds:
      - task: docs:version
      - mise exec -- npm ci --no-fund --no-audit
      - mise exec -- npm run check

  docs:pack:
    desc: "Pack @weebo/operator-docs into dist/weebo-operator-docs-<version>.tgz, the release asset the operators' docs sites install"
    cmds:
      - task: docs:version
      - mkdir -p dist
      - mise exec -- npm pack ./packages/operator-docs --pack-destination dist
