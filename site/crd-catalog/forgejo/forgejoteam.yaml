apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: forgejoteams.forgejo.weebo.io
spec:
  group: forgejo.weebo.io
  names:
    kind: ForgejoTeam
    plural: forgejoteams
    shortNames:
    - fjteam
    singular: forgejoteam
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.organizationRef.name
      name: Organization
      type: string
    - jsonPath: .spec.name
      name: Name
      type: string
    - jsonPath: .status.forgejoId
      name: ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ForgejoTeamSpec via `CustomResource`
        properties:
          spec:
            description: |-
              A team inside a `ForgejoOrganization`, with its members. Repositories
              grant themselves access to it through `ForgejoRepository.spec.teamRefs`.
            properties:
              canCreateOrgRepo:
                default: false
                type: boolean
              deletionPolicy:
                default: Delete
                description: What happens to the Forgejo object when its CR is deleted.
                enum:
                - Delete
                - Orphan
                type: string
              description:
                nullable: true
                type: string
              includesAllRepositories:
                default: false
                description: |-
                  Grant access to every repository of the organization, current and
                  future.
                type: boolean
              instanceRef:
                description: |-
                  The `ForgejoInstance` or `ForgejoLocalInstance` this object lives
                  on. Unset: the cluster's only `ForgejoInstance`, else the only
                  `ForgejoLocalInstance` of this namespace.
                nullable: true
                properties:
                  kind:
                    description: The kind of instance a reference designates.
                    enum:
                    - Instance
                    - LocalInstance
                    nullable: true
                    type: string
                  name:
                    description: '`metadata.name` of the instance.'
                    type: string
                  namespace:
                    description: |-
                      Namespace of a `LocalInstance`. Defaults to this object's own;
                      required on a cluster-scoped object. Another namespace's local
                      instance must share itself with this one (its `sharedWith`).
                    nullable: true
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: namespace only applies to kind LocalInstance
                  rule: '!has(self.namespace) || !has(self.kind) || self.kind == ''LocalInstance'''
              memberRefs:
                description: |-
                  Users in the team. The member list is authoritative:
                  anyone else is removed. A member whose user doesn't exist in Forgejo
                  yet (e.g. an observed OIDC user who never logged in) is reported as
                  `MemberPending` while the others are synced.
                items:
                  description: |-
                    A user, organization or team: a CR (`name`) — of this object's
                    namespace, or of `namespace` when cross-namespace references are
                    enabled for the operator and the target lists this namespace in its
                    `sharedWith` — or an object that exists in Forgejo but no CR manages
                    (`remoteName`, its Forgejo name). The operator never creates, changes
                    nor deletes a `remoteName` object.
                  properties:
                    name:
                      description: '`metadata.name` of the CR.'
                      nullable: true
                      type: string
                    namespace:
                      description: Namespace of the CR; defaults to this object's own.
                      nullable: true
                      type: string
                    remoteName:
                      description: |-
                        Forgejo name of an object no CR manages (a user's login, an
                        organization's or team's name).
                      nullable: true
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: set exactly one of name and remoteName
                    rule: has(self.name) != has(self.remoteName)
                  - message: namespace only applies with name
                    rule: '!has(self.namespace) || has(self.name)'
                type: array
              membersPolicy:
                default: Managed
                description: |-
                  Who decides the team's members. `Managed` (the default):
                  `memberRefs` is authoritative. `External`: the operator never adds
                  or removes members, leaving them to Forgejo's OIDC group sync
                  (`group-team-map` / `dyn-group-maps` on the authentication source);
                  `memberRefs` must then be empty.
                enum:
                - Managed
                - External
                type: string
              name:
                description: Team name, unique within the organization. `Owners` is reserved.
                type: string
              organizationRef:
                description: |-
                  The organization the team belongs to. A team can't move between
                  organizations: changing this deletes and recreates it, which needs
                  the `forgejo.weebo.io/allow-disruptive-update: "true"` annotation.
                properties:
                  name:
                    description: '`metadata.name` of the CR.'
                    nullable: true
                    type: string
                  namespace:
                    description: Namespace of the CR; defaults to this object's own.
                    nullable: true
                    type: string
                  remoteName:
                    description: |-
                      Forgejo name of an object no CR manages (a user's login, an
                      organization's or team's name).
                    nullable: true
                    type: string
                type: object
                x-kubernetes-validations:
                - message: set exactly one of name and remoteName
                  rule: has(self.name) != has(self.remoteName)
                - message: namespace only applies with name
                  rule: '!has(self.namespace) || has(self.name)'
              permission:
                default: read
                enum:
                - read
                - write
                - admin
                type: string
              sharedWith:
                description: |-
                  Other namespaces allowed to reference this object (when the operator
                  enables cross-namespace references). Unset: this namespace only.
                nullable: true
                properties:
                  clusterScoped:
                    description: Cluster-scoped objects may use this instance.
                    type: boolean
                  namespaceSelector:
                    description: |-
                      Namespaces whose labels match this selector may use this instance.
                      An empty selector (`{}`) matches every namespace: the instance —
                      and the token it holds — is then shared with the whole cluster.
                    nullable: true
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                        items:
                          description: A label selector requirement is a selector that contains values, a key, and an operator that relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector applies to.
                              type: string
                            operator:
                              description: operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                              items:
                                type: string
                              type: array
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                  namespaces:
                    description: Namespaces whose objects may use this instance.
                    items:
                      type: string
                    type: array
                type: object
              unitsMap:
                additionalProperties:
                  type: string
                description: |-
                  Per-unit access (`repo.code`, `repo.issues`, `repo.pulls`,
                  `repo.releases`, `repo.wiki`, `repo.packages`, `repo.actions`, ...)
                  to `none`, `read`, `write` or `admin`. Empty means every repository
                  unit at `permission` (Forgejo refuses a team without units). Ignored
                  by Forgejo when `permission` is `admin`.
                type: object
            required:
            - name
            - organizationRef
            type: object
          status:
            nullable: true
            properties:
              appliedSecretHash:
                description: |-
                  SHA-256 of the write-only inputs last sent to Forgejo (webhook
                  secret and authorization header), so a changed `Secret` value is
                  re-applied even though Forgejo never returns it.
                nullable: true
                type: string
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: One of the operator's reason codes — never a hand-written string.
                      type: string
                    status:
                      description: '`"True"`, `"False"`, or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              forgejoId:
                description: |-
                  The Forgejo-side identifier. Presence means this CR actually
                  owns/created the corresponding Forgejo object — set once on first
                  successful create (or seeded by the importer), never inferred by
                  name-matching. For `managementPolicy: Observe` users it is the id
                  of the observed user.
                nullable: true
                type: string
              forgejoName:
                description: |-
                  Current Forgejo-side name the API addresses the object by (user
                  login, organization or team name). Kept so a rename in `spec` knows
                  the old name to rename *from*.
                nullable: true
                type: string
              instance:
                description: |-
                  The instance this object was resolved to and stays bound to: a
                  `spec.instanceRef` by name only never silently moves to another
                  instance created later under that name.
                nullable: true
                properties:
                  kind:
                    description: '`Instance` or `LocalInstance`.'
                    enum:
                    - Instance
                    - LocalInstance
                    type: string
                  name:
                    type: string
                  namespace:
                    description: The local instance's namespace; absent for a cluster-scoped one.
                    nullable: true
                    type: string
                required:
                - kind
                - name
                type: object
              lastRotation:
                description: |-
                  Value of the `forgejo.weebo.io/rotate-secret` annotation the last
                  secret was issued for, so the same nonce never rotates twice. Only
                  used by kinds that emit a secret (a `rotationPeriod` renewal shows
                  as a new `forgejoId` instead).
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              ownerId:
                description: |-
                  Forgejo id of the account owning the object (an access token's
                  user, an OAuth2 application's owner), so a renamed owner isn't
                  mistaken for a different one.
                nullable: true
                type: string
              passwordEmitted:
                description: |-
                  A `ForgejoUser`'s generated password was handed out to its
                  `secretTargets`: turning it into a bot (or an external account) then
                  replaces the password, so the one handed out stops working. Never
                  set on an adopted account: its password isn't the operator's.
                nullable: true
                type: boolean
              secretPending:
                description: |-
                  A secret (token, client secret, password) was issued in Forgejo but
                  not written to every target: the targets may hold a revoked value,
                  so the next reconcile issues a new one instead of trusting them.
                nullable: true
                type: boolean
            type: object
        required:
        - spec
        title: ForgejoTeam
        type: object
        x-kubernetes-validations:
        - message: spec.memberRefs must be empty when membersPolicy is External
          rule: '!has(self.spec.membersPolicy) || self.spec.membersPolicy != ''External'' || !has(self.spec.memberRefs) || size(self.spec.memberRefs) == 0'
    served: true
    storage: true
    subresources:
      status: {}
