    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for BatleHubPackagePolicySpec via `CustomResource`
        properties:
          spec:
            description: |-
              The policy of a package, or of one version of it, in a registry of the
              instance, and the exemptions of a version from its gates.

              BatleHub keeps these in its database: the operator writes the policy
              through the admin API, reads it back on every pass (rewriting it when
              it was changed elsewhere), and clears it when this object is deleted
              (unless `deletionPolicy: Orphan`). A policy already on the node that
              this object didn't write is a conflict, never taken over.
            properties:
              deletionPolicy:
                default: Delete
                description: |-
                  `Delete` (default) clears what this object wrote when it is
                  deleted; `Orphan` leaves it on the instance.
                enum:
                - Delete
                - Orphan
                type: string
              exemptions:
                description: |-
                  The version's exemptions from its gates, one per gate. Needs
                  `version`, and a grant of `gates:exempt` to the operator's identity
                  on the version or its package (no role carries it).
                items:
                  description: A gate the version is exempted from, until a date.
                  properties:
                    exemptUntil:
                      description: |-
                        RFC 3339, in the future when written: an expired exemption is
                        reported (`ExemptionExpired`), never written.
                      format: date-time
                      minLength: 1
                      type: string
                    gate:
                      description: The gates a version may be exempted from.
                      enum:
                      - cve_gate
                      - license_gate
                      - security_verdict
                      - flags
                      type: string
                    reason:
                      description: 'Why: kept in BatleHub''s audit trail.'
                      maxLength: 1024
                      minLength: 1
                      type: string
                  required:
                  - exemptUntil
                  - gate
                  - reason
                  type: object
                maxItems: 4
                type: array
                x-kubernetes-list-map-keys:
                - gate
                x-kubernetes-list-type: map
              instanceRef:
                description: |-
                  The `BatleHubLocalInstance` of this namespace holding the registry;
                  unset, the only one of this namespace. Immutable.
                properties:
                  kind:
                    description: '`LocalInstance`, the only kind (may be left out).'
                    enum:
                    - LocalInstance
                    type: string
                  name:
                    description: '`metadata.name` of the `BatleHubLocalInstance`.'
                    minLength: 1
                    type: string
                  namespace:
                    description: 'Not allowed: the instance is in this object''s namespace.'
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: instanceRef is immutable
                  rule: self == oldSelf
                - message: the instance must be in this object's namespace
                  rule: '!has(self.__namespace__)'
              package:
                description: The package, as the registry names it (`@acme/billing`). Immutable.
                maxLength: 1024
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: package is immutable
                  rule: self == oldSelf
                - message: package may not be blank, have a `.` or `..` part between slashes, nor start or end with a space
                  rule: self == self.trim() && self.split('/').all(s, s != '.' && s != '..')
              policy:
                description: |-
                  The node's policy, as BatleHub's API takes it (snake_case keys): it
                  replaces the node's policy as a whole, a key left out inherits from
                  the tier above.
                properties:
                  prerelease_visibility:
                    enum:
                    - public
                    - internal
                    - team
                    - private
                    type: string
                  quota:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  rules:
                    items:
                      properties:
                        gate:
                          minLength: 1
                          type: string
                        settings:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                      required:
                      - gate
                      type: object
                    type: array
                  versioning:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  visibility:
                    enum:
                    - public
                    - internal
                    - team
                    - private
                    type: string
                type: object
              registry:
                description: The registry's name on the instance. Immutable.
                maxLength: 253
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: registry is immutable
                  rule: self == oldSelf
                - message: registry must be a registry name
                  rule: self != '.' && self != '..' && !self.contains('/')
              version:
                description: One version of the package; unset, the package itself. Immutable.
                maxLength: 256
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: version is immutable
                  rule: self == oldSelf
                - message: version may not be `.`, contain `..`, `/` or `\`, nor start or end with a space
                  rule: self == self.trim() && self != '.' && !self.contains('..') && !self.contains('/') && !self.contains('\\')
            required:
            - package
            - registry
            type: object
            x-kubernetes-validations:
            - message: instanceRef is immutable
              rule: has(self.instanceRef) == has(oldSelf.instanceRef)
            - message: version is immutable
              rule: has(self.version) == has(oldSelf.version)
            - message: set policy, exemptions, or both
              rule: has(self.policy) || (has(self.exemptions) && size(self.exemptions) > 0)
            - message: 'exemptions apply to a version: set version'
              rule: '!has(self.exemptions) || size(self.exemptions) == 0 || has(self.version)'
          status:
            description: What the operator wrote.
            nullable: true
            properties:
              appliedExemptions:
                description: The exemptions the operator wrote, recorded after each write.
                items:
                  description: One exemption the operator wrote.
                  properties:
                    exemptUntil:
                      description: As BatleHub stored it (UTC).
                      type: string
                    gate:
                      type: string
                    reason:
                      type: string
                  required:
                  - exemptUntil
                  - gate
                  - reason
                  type: object
                type: array
              appliedPolicyHash:
                description: The hash of `spec.policy` when the operator wrote it.
                nullable: true
                type: string
              conditions:
                default: []
                description: '`Ready`, carrying one of the operator''s reason codes.'
                items:
                  properties:
                    lastTransitionTime:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: One of the operator's reason codes — never a hand-written string.
                      type: string
                    status:
                      description: '`"True"`, `"False"`, or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              instance:
                description: The instance this object was resolved to and stays bound to.
                nullable: true
                properties:
                  kind:
                    description: '`Instance` or `LocalInstance`.'
                    enum:
                    - Instance
                    - LocalInstance
                    type: string
                  name:
                    type: string
                  namespace:
                    description: The local instance's namespace; absent for a cluster-scoped one.
                    nullable: true
                    type: string
                required:
                - kind
                - name
                type: object
              lastSyncTime:
                description: The last pass that changed something on the instance.
                nullable: true
                type: string
              observedGeneration:
                description: The `metadata.generation` the last successful reconcile applied.
                format: int64
                nullable: true
                type: integer
              observedPolicyHash:
                description: |-
                  The hash of the policy the instance returned right after
                  (exemptions left out): a later read hashing otherwise was changed
                  elsewhere, and is written again.
                nullable: true
                type: string
            type: object
        required:
