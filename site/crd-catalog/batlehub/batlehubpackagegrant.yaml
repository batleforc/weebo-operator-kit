                        maxLength: 128
                        minLength: 1
                        pattern: ^\S+$
                        type: string
                      maxItems: 64
                      minItems: 1
                      type: array
                    subject:
                      description: |-
                        Who, as BatleHub spells it: `user:alice`, `group:oidc1:eng`,
                        `role:user`, `*`.
                      maxLength: 512
                      minLength: 1
                      pattern: ^\S+$
                      type: string
                  required:
                  - actions
                  - subject
                  type: object
                maxItems: 256
                minItems: 1
                type: array
