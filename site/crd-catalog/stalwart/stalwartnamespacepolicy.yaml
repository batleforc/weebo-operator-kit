apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stalwartnamespacepolicies.stalwart.weebo.io
spec:
  group: stalwart.weebo.io
  names:
    kind: StalwartNamespacePolicy
    plural: stalwartnamespacepolicies
    singular: stalwartnamespacepolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for StalwartNamespacePolicySpec via `CustomResource`
        properties:
          spec:
            description: |-
              Namespace allow-list for the namespaced account kinds, enforced by the
              admission webhook (CREATE/UPDATE) and re-checked by every reconciler
              before any Stalwart call. It governs the CRs bound to a
              `StalwartInstance` (shared by every namespace); a CR bound to a
              `StalwartLocalInstance` is bounded by its namespace's own token instead.

              While no `StalwartNamespacePolicy` exists, everything is allowed. As
              soon as one exists, a namespaced CR is only accepted if some `Allow`
              rule matches its namespace and kind and covers the domains and names
              it asks for — and no `Deny` rule matches. Rules of every policy are
              pooled; a `Deny` always wins.
            properties:
              rules:
                items:
                  properties:
                    allowedDomains:
                      description: |-
                        `StalwartDomain`s (by `metadata.name`) the objects may live in.
                        Unset: any. On a `Deny` rule: only deny requests in one of these.
                      items:
                        type: string
                      nullable: true
                      type: array
                    allowedKinds:
                      items:
                        description: The namespaced kinds a rule may allow.
                        enum:
                        - StalwartServiceAccount
                        - StalwartAccount
                        - StalwartGroup
                        - StalwartMailingList
                        type: string
                      type: array
                    allowedNames:
                      description: |-
                        Local-parts the objects may claim: an object's name **and** each of
                        its aliases must be listed. Unset: any. On a `Deny` rule: deny
                        requests whose name or any alias is listed — the way to reserve
                        names (`postmaster`, `admin`…) for every namespace.
                      items:
                        type: string
                      nullable: true
                      type: array
                    effect:
                      default: Allow
                      enum:
                      - Allow
                      - Deny
                      type: string
                    namespaces:
                      description: Namespace names, `*` for all, or a prefix glob like `team-*`.
                      items:
                        type: string
                      type: array
                  required:
                  - allowedKinds
                  - namespaces
                  type: object
                type: array
            required:
            - rules
            type: object
          status:
            nullable: true
            properties:
              address:
                description: |-
                  The address (or, for a domain, the name) Stalwart confirmed at the
                  last reconcile. A read by `remoteId` answering another one is taken
                  as the object being gone — its id reused by another object after a
                  reset — never patched.
                nullable: true
                type: string
              conditions:
                default: []
                description: '`Ready`, carrying one of the operator''s reason codes.'
                items:
                  properties:
                    lastTransitionTime:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: One of the operator's reason codes — never a hand-written string.
                      type: string
                    status:
                      description: '`"True"`, `"False"`, or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              instance:
                description: |-
                  The instance this object was resolved to and stays bound to: a
                  `spec.instanceRef` by name only never silently moves to another
                  instance created later under the same name.
                nullable: true
                properties:
                  kind:
                    description: '`Instance` or `LocalInstance`.'
                    enum:
                    - Instance
                    - LocalInstance
                    type: string
                  name:
                    type: string
                  namespace:
                    description: The local instance's namespace; absent for a cluster-scoped one.
                    nullable: true
                    type: string
                required:
                - kind
                - name
                type: object
              lastRotation:
                description: |-
                  Value of the `stalwart.weebo.io/rotate-secret` annotation the last
                  emitted secret was issued for: the same nonce never rotates twice.
                  Only on kinds that emit a secret.
                nullable: true
                type: string
              observedGeneration:
                description: The `metadata.generation` the last successful reconcile applied.
                format: int64
                nullable: true
                type: integer
              remoteId:
                description: |-
                  Identifier of the remote object, as Stalwart returned it. Its
                  presence means this CR created (and owns) that object: the remote
                  object is read by this id, never looked up by name, and the
                  finalizer only deletes what is recorded here. Set once at creation,
                  or by `weebo-stalwart-importer`.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: StalwartNamespacePolicy
        type: object
    served: true
    storage: true
    subresources:
      status: {}
