apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stalwartserviceaccounts.stalwart.weebo.io
spec:
  group: stalwart.weebo.io
  names:
    kind: StalwartServiceAccount
    plural: stalwartserviceaccounts
    singular: stalwartserviceaccount
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.instance.name
      name: Instance
      type: string
    - jsonPath: .status.address
      name: Address
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for StalwartServiceAccountSpec via `CustomResource`
        properties:
          spec:
            description: |-
              A sending account of an application (`x:Account` of type `User`,
              authenticating with an App Password): the operator creates the account
              without any password, has Stalwart generate an App Password for it
              (granting `authenticate` and `emailSend` only) with the instance's
              `appPasswordTokenSecretRef` key, and writes the SMTP submission settings
              to `secretTargets` (`host`, `port`, `security`, `username` — the
              address —, `password` — the App Password —, `from`). It logs in over
              SMTP submission only: IMAP, POP3 and ManageSieve logins are disabled,
              and so is delivery unless `receive` is set. An instance without
              `appPasswordTokenSecretRef` fails with `TokenSecretMissing`.

              A new App Password replaces the previous one (revoked in the same call;
              the account's other App Passwords are left alone) when the annotation
              `stalwart.weebo.io/rotate-secret` takes a new value, or when a target
              lost it. The account is read by `status.remoteId`, never adopted by
              name: an address already taken in Stalwart fails
              (`StalwartObjectAlreadyExists`) until `weebo-stalwart-importer` links
              it to this CR.
            properties:
              aliases:
                description: |-
                  Other local-parts of the account, in the same domain, usable as
                  sender (`from` is the first one). Compared as a set.
                items:
                  type: string
                maxItems: 32
                type: array
              deletionPolicy:
                default: Delete
                description: |-
                  `Delete` (default): deleting the CR deletes the account and the
                  secrets it wrote. `Orphan`: both are left in place.
                enum:
                - Delete
                - Orphan
                type: string
              domainRef:
                description: |-
                  The `StalwartDomain` (cluster-scoped, by `metadata.name`) the
                  account's address and aliases are in. It must be `Ready` on the
                  same instance.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              instanceRef:
                description: |-
                  The `StalwartInstance` (or `StalwartLocalInstance`) the account
                  lives on. Unset: the only `StalwartInstance`, else the only
                  `StalwartLocalInstance` of the namespace.
                nullable: true
                properties:
                  kind:
                    description: The kind of instance a reference designates.
                    enum:
                    - Instance
                    - LocalInstance
                    nullable: true
                    type: string
                  name:
                    description: '`metadata.name` of the instance.'
                    type: string
                  namespace:
                    description: |-
                      Namespace of a `LocalInstance`. Defaults to this object's own;
                      required on a cluster-scoped object. Another namespace's local
                      instance must share itself with this one (its `sharedWith`).
                    nullable: true
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: namespace only applies to kind LocalInstance
                  rule: '!has(self.namespace) || !has(self.kind) || self.kind == ''LocalInstance'''
              name:
                description: |-
                  The local-part of the account's address (`<name>@<domain>`),
                  lowercased. Defaults to the CR's `metadata.name`. Changing it moves
                  the address: only applied with the annotation
                  `stalwart.weebo.io/allow-disruptive-update: "true"`.
                nullable: true
                type: string
              receive:
                default: false
                description: |-
                  Whether mail sent to the account is delivered. `false`: delivery is
                  disabled (a no-reply sender).
                type: boolean
              secretTargets:
                description: |-
                  Where the SMTP settings and the App Password are written.
                  Empty: one Kubernetes `Secret` named after the CR, in its namespace
                  (only when the instance's default backend is `kubernetes`). A Vault
                  target must be named `smtp`, without `path`: it is written to
                  `<pathPrefix>/<namespace>/smtp`, the only path the operator's Vault
                  role may write.
                items:
                  description: |-
                    Where an emitted secret (generated password or key, OAuth2 credentials,
                    access token) is written. A CR may list several targets — the same
                    value is fanned out to each.
                  properties:
                    backend:
                      default: kubernetes
                      description: |-
                        `kubernetes` (default) or `vault`. A Vault target reuses the Vault
                        connection (address, mount, auth) the instance configures, which it
                        must then do.
                      enum:
                      - kubernetes
                      - vault
                      type: string
                    name:
                      description: |-
                        Kubernetes: the `Secret` name. Vault: names the default path
                        `<pathPrefix>/<namespace>/<name>` when `path` is unset.
                      type: string
                    namespace:
                      description: |-
                        Kubernetes `Secret` namespace (Vault: the namespace segment of the
                        default path). Defaults to the CR's own namespace; required on
                        cluster-scoped CRs. A namespaced CR may only name its own namespace.
                      nullable: true
                      type: string
                    path:
                      description: |-
                        Vault only: explicit KV v2 path under the instance's mount. It must
                        stay under `<pathPrefix>/<namespace>/` (this object's namespace, or
                        the target's on a cluster-scoped object), unless the instance's
                        `pathGrants` open it to this object.
                      nullable: true
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 8
                type: array
            required:
            - domainRef
            type: object
          status:
            nullable: true
            properties:
              address:
                description: |-
                  The address (or, for a domain, the name) Stalwart confirmed at the
                  last reconcile. A read by `remoteId` answering another one is taken
                  as the object being gone — its id reused by another object after a
                  reset — never patched.
                nullable: true
                type: string
              conditions:
                default: []
                description: '`Ready`, carrying one of the operator''s reason codes.'
                items:
                  properties:
                    lastTransitionTime:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: One of the operator's reason codes — never a hand-written string.
                      type: string
                    status:
                      description: '`"True"`, `"False"`, or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              instance:
                description: |-
                  The instance this object was resolved to and stays bound to: a
                  `spec.instanceRef` by name only never silently moves to another
                  instance created later under the same name.
                nullable: true
                properties:
                  kind:
                    description: '`Instance` or `LocalInstance`.'
                    enum:
                    - Instance
                    - LocalInstance
                    type: string
                  name:
                    type: string
                  namespace:
                    description: The local instance's namespace; absent for a cluster-scoped one.
                    nullable: true
                    type: string
                required:
                - kind
                - name
                type: object
              lastRotation:
                description: |-
                  Value of the `stalwart.weebo.io/rotate-secret` annotation the last
                  emitted secret was issued for: the same nonce never rotates twice.
                  Only on kinds that emit a secret.
                nullable: true
                type: string
              observedGeneration:
                description: The `metadata.generation` the last successful reconcile applied.
                format: int64
                nullable: true
                type: integer
              remoteId:
                description: |-
                  Identifier of the remote object, as Stalwart returned it. Its
                  presence means this CR created (and owns) that object: the remote
                  object is read by this id, never looked up by name, and the
                  finalizer only deletes what is recorded here. Set once at creation,
                  or by `weebo-stalwart-importer`.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: StalwartServiceAccount
        type: object
    served: true
    storage: true
    subresources:
      status: {}
