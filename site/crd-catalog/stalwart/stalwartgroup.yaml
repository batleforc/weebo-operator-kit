apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stalwartgroups.stalwart.weebo.io
spec:
  group: stalwart.weebo.io
  names:
    kind: StalwartGroup
    plural: stalwartgroups
    singular: stalwartgroup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.instance.name
      name: Instance
      type: string
    - jsonPath: .status.address
      name: Address
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for StalwartGroupSpec via `CustomResource`
        properties:
          spec:
            description: |-
              A group (`x:Account` of type `Group`): a shared address delivering to
              its members. Its members are not managed here: the OpenID Connect login
              sets them from the provider's `groups` claim, where `name` must appear.

              The OpenID Connect login also creates a group for every name of the
              claim the first time a member logs in: a `StalwartGroup` declared after
              that fails (`StalwartObjectAlreadyExists`) until
              `weebo-stalwart-importer` links it to the existing group — declare it
              before the group is published in the claim.
            properties:
              aliases:
                description: |-
                  Other local-parts delivering to the group, in the same domain.
                  Compared as a set.
                items:
                  type: string
                maxItems: 32
                type: array
              deletionPolicy:
                default: Orphan
                description: |-
                  `Orphan` (default): deleting the CR leaves the group in Stalwart.
                  `Delete`: deleting the CR deletes the group (refused by Stalwart, and
                  retried, while accounts are still members).
                enum:
                - Delete
                - Orphan
                type: string
              domainRef:
                description: |-
                  The `StalwartDomain` (cluster-scoped, by `metadata.name`) the
                  group's address and aliases are in. It must be `Ready` on the same
                  instance.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              instanceRef:
                description: |-
                  The `StalwartInstance` (or `StalwartLocalInstance`) the group lives
                  on. Unset: the only `StalwartInstance`, else the only
                  `StalwartLocalInstance` of the namespace.
                nullable: true
                properties:
                  kind:
                    description: The kind of instance a reference designates.
                    enum:
                    - Instance
                    - LocalInstance
                    nullable: true
                    type: string
                  name:
                    description: '`metadata.name` of the instance.'
                    type: string
                  namespace:
                    description: |-
                      Namespace of a `LocalInstance`. Defaults to this object's own;
                      required on a cluster-scoped object. Another namespace's local
                      instance must share itself with this one (its `sharedWith`).
                    nullable: true
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: namespace only applies to kind LocalInstance
                  rule: '!has(self.namespace) || !has(self.kind) || self.kind == ''LocalInstance'''
              name:
                description: |-
                  The local-part of the group's address, lowercased: the group's name
                  in the OpenID Connect provider's `groups` claim. Defaults to the
                  CR's `metadata.name`. Changing it moves the address: only applied
                  with the annotation `stalwart.weebo.io/allow-disruptive-update:
                  "true"`.
                nullable: true
                type: string
              quota:
                description: |-
                  Disk quota of the group's shared mailbox (`10Gi`). Unset: no
                  opinion.
                nullable: true
                x-kubernetes-int-or-string: true
            required:
            - domainRef
            type: object
          status:
            nullable: true
            properties:
              address:
                description: |-
                  The address (or, for a domain, the name) Stalwart confirmed at the
                  last reconcile. A read by `remoteId` answering another one is taken
                  as the object being gone — its id reused by another object after a
                  reset — never patched.
                nullable: true
                type: string
              conditions:
                default: []
                description: '`Ready`, carrying one of the operator''s reason codes.'
                items:
                  properties:
                    lastTransitionTime:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: One of the operator's reason codes — never a hand-written string.
                      type: string
                    status:
                      description: '`"True"`, `"False"`, or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              instance:
                description: |-
                  The instance this object was resolved to and stays bound to: a
                  `spec.instanceRef` by name only never silently moves to another
                  instance created later under the same name.
                nullable: true
                properties:
                  kind:
                    description: '`Instance` or `LocalInstance`.'
                    enum:
                    - Instance
                    - LocalInstance
                    type: string
                  name:
                    type: string
                  namespace:
                    description: The local instance's namespace; absent for a cluster-scoped one.
                    nullable: true
                    type: string
                required:
                - kind
                - name
                type: object
              lastRotation:
                description: |-
                  Value of the `stalwart.weebo.io/rotate-secret` annotation the last
                  emitted secret was issued for: the same nonce never rotates twice.
                  Only on kinds that emit a secret.
                nullable: true
                type: string
              observedGeneration:
                description: The `metadata.generation` the last successful reconcile applied.
                format: int64
                nullable: true
                type: integer
              remoteId:
                description: |-
                  Identifier of the remote object, as Stalwart returned it. Its
                  presence means this CR created (and owns) that object: the remote
                  object is read by this id, never looked up by name, and the
                  finalizer only deletes what is recorded here. Set once at creation,
                  or by `weebo-stalwart-importer`.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: StalwartGroup
        type: object
    served: true
    storage: true
    subresources:
      status: {}
