apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stalwartlocalinstances.stalwart.weebo.io
spec:
  group: stalwart.weebo.io
  names:
    kind: StalwartLocalInstance
    plural: stalwartlocalinstances
    singular: stalwartlocalinstance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for StalwartLocalInstanceSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Connection to one Stalwart server (v0.16), owned by a namespace: its
              token is that namespace's, and only its objects use it unless
              `sharedWith` says otherwise. What an operator limited to one namespace
              uses. Objects bound to it are not governed by `StalwartNamespacePolicy`
              (the namespace's own token bounds them) and write their secrets as
              Kubernetes `Secret`s only: the operator's Vault identity is shared by
              every namespace. `Ready` tells whether the server answers with the
              token below and speaks a supported management schema.
            properties:
              appPasswordTokenSecretRef:
                description: |-
                  A second API key of Stalwart, on the same account as the one above,
                  in a `Secret` of this namespace with the same label: the one that
                  creates, rotates and revokes the App Passwords of the
                  `StalwartServiceAccount`s (permissions `authenticate`,
                  `impersonate`, `emailSend` and `sysAppPassword*` only). Read on
                  every reconcile of a `StalwartServiceAccount`; unset, those fail
                  with `TokenSecretMissing` (the other kinds don't use it).
                nullable: true
                properties:
                  key:
                    type: string
                  name:
                    type: string
                required:
                - key
                - name
                type: object
              sharedWith:
                description: |-
                  Other namespaces (or cluster-scoped objects) allowed to use this
                  instance — and its token. Unset: this namespace only.
                nullable: true
                properties:
                  clusterScoped:
                    description: Cluster-scoped objects may use this instance.
                    type: boolean
                  namespaceSelector:
                    description: |-
                      Namespaces whose labels match this selector may use this instance.
                      An empty selector (`{}`) matches every namespace: the instance —
                      and the token it holds — is then shared with the whole cluster.
                    nullable: true
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                        items:
                          description: A label selector requirement is a selector that contains values, a key, and an operator that relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector applies to.
                              type: string
                            operator:
                              description: operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                              items:
                                type: string
                              type: array
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                  namespaces:
                    description: Namespaces whose objects may use this instance.
                    items:
                      type: string
                    type: array
                type: object
              submission:
                default:
                  host: stalwart.mail.svc.cluster.local
                  port: 587
                  security: starttls
                description: The submission service the emitted credentials announce.
                properties:
                  host:
                    default: stalwart.mail.svc.cluster.local
                    description: Host name of the submission service.
                    type: string
                  port:
                    default: 587
                    description: Port of the submission service.
                    format: uint16
                    maximum: 65535.0
                    minimum: 1.0
                    type: integer
                  security:
                    default: starttls
                    description: Transport security a client must use.
                    enum:
                    - starttls
                    - tls
                    - none
                    type: string
                type: object
              tls:
                default:
                  insecureSkipVerify: false
                description: |-
                  TLS verification of the connection above; the CA `Secret` lives in
                  this namespace.
                properties:
                  caSecretRef:
                    description: |-
                      Optional custom CA certificate (a PEM bundle under `key`) to verify
                      the instance's TLS with, read from a `Secret` of the instance's own
                      namespace. Added on top of the platform trust store.
                    nullable: true
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  insecureSkipVerify:
                    default: false
                    description: |-
                      Skip certificate verification entirely — insecure, intended only for
                      throwaway/self-signed instances. Prefer `caSecretRef` below.
                    type: boolean
                type: object
              tokenSecretRef:
                description: |-
                  An API key of Stalwart (sent as `Authorization: Bearer`), in a
                  `Secret` of this namespace labelled
                  `stalwart.weebo.io/instance-token: "true"` (without the label the
                  operator doesn't read it). Read on every reconcile: rotating it
                  needs no restart.
                properties:
                  key:
                    type: string
                  name:
                    type: string
                required:
                - key
                - name
                type: object
              url:
                description: |-
                  Base URL of the Stalwart HTTP listener, e.g.
                  `http://stalwart.mail.svc:8080` (JMAP at `<url>/jmap`).
                type: string
            required:
            - tokenSecretRef
            - url
            type: object
          status:
            nullable: true
            properties:
              address:
                description: |-
                  The address (or, for a domain, the name) Stalwart confirmed at the
                  last reconcile. A read by `remoteId` answering another one is taken
                  as the object being gone — its id reused by another object after a
                  reset — never patched.
                nullable: true
                type: string
              conditions:
                default: []
                description: '`Ready`, carrying one of the operator''s reason codes.'
                items:
                  properties:
                    lastTransitionTime:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: One of the operator's reason codes — never a hand-written string.
                      type: string
                    status:
                      description: '`"True"`, `"False"`, or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              instance:
                description: |-
                  The instance this object was resolved to and stays bound to: a
                  `spec.instanceRef` by name only never silently moves to another
                  instance created later under the same name.
                nullable: true
                properties:
                  kind:
                    description: '`Instance` or `LocalInstance`.'
                    enum:
                    - Instance
                    - LocalInstance
                    type: string
                  name:
                    type: string
                  namespace:
                    description: The local instance's namespace; absent for a cluster-scoped one.
                    nullable: true
                    type: string
                required:
                - kind
                - name
                type: object
              lastRotation:
                description: |-
                  Value of the `stalwart.weebo.io/rotate-secret` annotation the last
                  emitted secret was issued for: the same nonce never rotates twice.
                  Only on kinds that emit a secret.
                nullable: true
                type: string
              observedGeneration:
                description: The `metadata.generation` the last successful reconcile applied.
                format: int64
                nullable: true
                type: integer
              remoteId:
                description: |-
                  Identifier of the remote object, as Stalwart returned it. Its
                  presence means this CR created (and owns) that object: the remote
                  object is read by this id, never looked up by name, and the
                  finalizer only deletes what is recorded here. Set once at creation,
                  or by `weebo-stalwart-importer`.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: StalwartLocalInstance
        type: object
    served: true
    storage: true
    subresources:
      status: {}
