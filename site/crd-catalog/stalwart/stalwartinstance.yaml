apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stalwartinstances.stalwart.weebo.io
spec:
  group: stalwart.weebo.io
  names:
    kind: StalwartInstance
    plural: stalwartinstances
    singular: stalwartinstance
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for StalwartInstanceSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Connection to one Stalwart server (v0.16). Cluster-scoped: an org-wide
              piece of infrastructure, not owned by a namespace (a namespace's own
              server is a `StalwartLocalInstance`). `Ready` tells whether the server
              answers with the token below and speaks a management schema this
              operator release supports.
            properties:
              appPasswordTokenSecretRef:
                description: |-
                  A second API key of Stalwart, on the same account as the one above:
                  the one that creates, rotates and revokes the App Passwords of the
                  `StalwartServiceAccount`s (permissions `authenticate`,
                  `impersonate`, `emailSend` and `sysAppPassword*` only). Read on
                  every reconcile of a `StalwartServiceAccount`; unset, those fail
                  with `TokenSecretMissing` (the other kinds don't use it).
                nullable: true
                properties:
                  key:
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - key
                - name
                - namespace
                type: object
              secretStore:
                default:
                  backend: kubernetes
                description: |-
                  Default destination of the secrets the CRs bound to this instance
                  emit, when they list no `secretTargets`. Default: a Kubernetes
                  `Secret`.
                properties:
                  backend:
                    default: kubernetes
                    description: |-
                      Backend of a CR's implicit target (one named after the CR, when it
                      lists no `secretTargets`).
                    enum:
                    - kubernetes
                    - vault
                    type: string
                  vault:
                    description: The Vault connection a `vault` target writes through.
                    nullable: true
                    properties:
                      address:
                        description: Vault server address, e.g. `https://vault.example.com:8200`.
                        type: string
                      caSecretRef:
                        description: |-
                          A private CA to verify Vault's TLS with: a PEM bundle under `key`
                          of a `Secret`, read through the API. Unset: the system trust store.
                          Only consulted for `https://` addresses.
                        nullable: true
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                        - key
                        - name
                        - namespace
                        type: object
                      kubernetesAuthMount:
                        default: kubernetes
                        description: Mount path of Vault's Kubernetes auth backend.
                        type: string
                      kubernetesAuthRole:
                        description: |-
                          Vault Kubernetes-auth role the operator authenticates as: its own
                          ServiceAccount token is exchanged for a Vault token through
                          `auth/<kubernetesAuthMount>/login`.
                        type: string
                      mount:
                        description: |-
                          KV v2 secrets engine mount (e.g. `secret`) credentials are written
                          under.
                        type: string
                      pathGrants:
                        description: |-
                          Vault paths this instance's CRs may write to outside their
                          namespace's subtree `<pathPrefix>/<namespace>/`, per namespace
                          (`clusterScoped` is refused: every object writing credentials is
                          namespaced). The Vault policy of the operator's role stays the hard
                          bound.
                        items:
                          description: |-
                            Paths of the instance's secret backend that objects may write to
                            outside their namespace's subtree `<pathPrefix>/<namespace>/`. Opens
                            them to every subject allowed to create an emitting object in a
                            covered namespace, and cannot hand over a value another object owns.
                          properties:
                            clusterScoped:
                              description: |-
                                The grant opens `paths` to cluster-scoped objects (instead of
                                `namespaces`).
                              type: boolean
                            namespaces:
                              description: |-
                                Namespaces whose objects may write `paths`: exact names, `*`, or a
                                prefix glob such as `team-*`. `team-*` opens the paths to every
                                matching namespace.
                              items:
                                maxLength: 64
                                minLength: 1
                                type: string
                              maxItems: 64
                              type: array
                            paths:
                              description: |-
                                Path patterns under the mount, compared segment by segment: a
                                literal segment matches itself, `+` exactly one segment, and a last
                                `*` one or more. Each holds at least one literal segment, e.g.
                                `shared/auth`, `+/auth`, `platform/*`. Prefer exact paths where
                                values not written by the operator live: a covered object may take
                                over a value no object owns yet.
                              items:
                                maxLength: 512
                                pattern: ^(?:(?:[^/*+]+|\+)/)*(?:[^/*+]+|\+|\*)$
                                type: string
                                x-kubernetes-validations:
                                - message: a path pattern has no "." or ".." segment
                                  rule: '!self.matches(''(^|/)\\.\\.?(/|$)'')'
                                - message: a path pattern has at least one literal segment
                                  rule: self.matches('(^|/)[^/*+]+(/|$)')
                              maxItems: 64
                              minItems: 1
                              type: array
                          required:
                          - paths
                          type: object
                          x-kubernetes-validations:
                          - message: a grant names namespaces or is clusterScoped, not both
                            rule: (has(self.namespaces) && size(self.namespaces) > 0) != (has(self.clusterScoped) && self.clusterScoped)
                        maxItems: 32
                        type: array
                      pathPrefix:
                        default: weebo-stalwart
                        description: |-
                          Path prefix under `mount`: the default KV path of a target is
                          `<pathPrefix>/<namespace>/<name>`, one secret per target. Empty:
                          `<namespace>/<name>`. An explicit `path` must stay under
                          `<pathPrefix>/<namespace>/` unless `pathGrants` opens it.

                          With an empty prefix, a path holding a value no CR owns (written by
                          another tool) is taken over by the first CR writing it: only the
                          Vault policy of the operator's role then keeps a CR away from such
                          values. Keep a prefix unless that policy is narrowed to the paths
                          the CRs may write.
                        type: string
                    required:
                    - address
                    - kubernetesAuthRole
                    - mount
                    type: object
                    x-kubernetes-validations:
                    - message: 'pathGrants name namespaces: every object writing credentials is namespaced, clusterScoped grants never apply'
                      rule: '!has(self.pathGrants) || self.pathGrants.all(g, !has(g.clusterScoped) || !g.clusterScoped)'
                type: object
              submission:
                default:
                  host: stalwart.mail.svc.cluster.local
                  port: 587
                  security: starttls
                description: The submission service the emitted credentials announce.
                properties:
                  host:
                    default: stalwart.mail.svc.cluster.local
                    description: Host name of the submission service.
                    type: string
                  port:
                    default: 587
                    description: Port of the submission service.
                    format: uint16
                    maximum: 65535.0
                    minimum: 1.0
                    type: integer
                  security:
                    default: starttls
                    description: Transport security a client must use.
                    enum:
                    - starttls
                    - tls
                    - none
                    type: string
                type: object
              tls:
                default:
                  insecureSkipVerify: false
                description: |-
                  TLS verification of the connection above: a private CA to trust
                  (`tls.caSecretRef`), or `tls.insecureSkipVerify`. Default: the
                  platform trust store.
                properties:
                  caSecretRef:
                    description: |-
                      Optional custom CA certificate to verify the instance's TLS with,
                      read from a Kubernetes `Secret` (the referenced `key` must hold a PEM
                      bundle). Use this to trust a private CA without mounting it into the
                      operator pod — the operator reads the Secret via the API and hands the
                      PEM to its HTTP client. It is added *on top of* the platform trust
                      store, so publicly-signed endpoints keep working. When unset, only the
                      platform trust store (plus the usual `SSL_CERT_FILE`/`SSL_CERT_DIR`
                      env vars) is used.
                    nullable: true
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - key
                    - name
                    - namespace
                    type: object
                  insecureSkipVerify:
                    default: false
                    description: |-
                      Skip certificate verification entirely — insecure, intended only for
                      throwaway/self-signed instances. Prefer `caSecretRef` below, which
                      trusts a private CA without turning verification off.
                    type: boolean
                type: object
              tokenSecretRef:
                description: |-
                  An API key of Stalwart, sent as `Authorization: Bearer`. Read on
                  every reconcile: rotating it needs no restart.
                properties:
                  key:
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - key
                - name
                - namespace
                type: object
              url:
                description: |-
                  Base URL of the Stalwart HTTP listener, e.g.
                  `http://stalwart.mail.svc:8080`. Management goes through JMAP,
                  `POST <url>/jmap` (session `GET <url>/jmap/session`); `<url>/api`
                  only serves the schema, whose hash identifies the server's version.
                type: string
            required:
            - tokenSecretRef
            - url
            type: object
          status:
            nullable: true
            properties:
              address:
                description: |-
                  The address (or, for a domain, the name) Stalwart confirmed at the
                  last reconcile. A read by `remoteId` answering another one is taken
                  as the object being gone — its id reused by another object after a
                  reset — never patched.
                nullable: true
                type: string
              conditions:
                default: []
                description: '`Ready`, carrying one of the operator''s reason codes.'
                items:
                  properties:
                    lastTransitionTime:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: One of the operator's reason codes — never a hand-written string.
                      type: string
                    status:
                      description: '`"True"`, `"False"`, or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              instance:
                description: |-
                  The instance this object was resolved to and stays bound to: a
                  `spec.instanceRef` by name only never silently moves to another
                  instance created later under the same name.
                nullable: true
                properties:
                  kind:
                    description: '`Instance` or `LocalInstance`.'
                    enum:
                    - Instance
                    - LocalInstance
                    type: string
                  name:
                    type: string
                  namespace:
                    description: The local instance's namespace; absent for a cluster-scoped one.
                    nullable: true
                    type: string
                required:
                - kind
                - name
                type: object
              lastRotation:
                description: |-
                  Value of the `stalwart.weebo.io/rotate-secret` annotation the last
                  emitted secret was issued for: the same nonce never rotates twice.
                  Only on kinds that emit a secret.
                nullable: true
                type: string
              observedGeneration:
                description: The `metadata.generation` the last successful reconcile applied.
                format: int64
                nullable: true
                type: integer
              remoteId:
                description: |-
                  Identifier of the remote object, as Stalwart returned it. Its
                  presence means this CR created (and owns) that object: the remote
                  object is read by this id, never looked up by name, and the
                  finalizer only deletes what is recorded here. Set once at creation,
                  or by `weebo-stalwart-importer`.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: StalwartInstance
        type: object
    served: true
    storage: true
    subresources:
      status: {}
