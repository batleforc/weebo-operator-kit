[package]
name = "weebo-kit-adapters"
description = "Outbound adapters shared by the weebo operators: Kubernetes and Vault secret stores"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
weebo-kit-api = { workspace = true }
weebo-kit-application = { workspace = true }
weebo-kit-domain = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
k8s-openapi = { workspace = true }
kube = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
vaultrs = { workspace = true }

[dev-dependencies]
rcgen = "0.14.10"
# The grant schema's `pattern` and CEL regexes, checked against the domain.
regex = "1"
# The process-level crypto provider of the scripted Kubernetes client.
rustls = { workspace = true }
# `#[derive(CustomResource)]` of the test instance kinds.
schemars = { workspace = true }
serde_json = { workspace = true }
# `start_paused` in the store-readiness tests.
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
