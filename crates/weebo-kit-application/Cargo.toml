[package]
name = "weebo-kit-application"
description = "Port traits and use-case helpers shared by the weebo operators (secret stores, managed workloads)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
weebo-kit-api = { workspace = true }
# Field types only (`LabelSelector`), as in weebo-kit-api: no client.
k8s-openapi = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
# Owned objects as manifests (`OwnedObject::of`), the hash of a content.
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# The version the kit is tested with (RFC 0005).
k8s-openapi = { workspace = true, features = ["v1_36"] }
tokio = { workspace = true }

[features]
# Exposes `test_support` (in-memory secret store, owned objects, pod logs)
# to other crates' tests.
test-support = []

[lints]
workspace = true
