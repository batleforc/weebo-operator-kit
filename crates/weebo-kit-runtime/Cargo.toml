[package]
name = "weebo-kit-runtime"
description = "Operator runtime shared by the weebo operators: telemetry, leader election, graceful shutdown, TLS webhook server, reconcile metrics, status conditions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
weebo-kit-api = { workspace = true }
weebo-kit-domain = { workspace = true }
weebo-kit-application = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
futures = { workspace = true }
k8s-openapi = { workspace = true }
kube = { workspace = true, features = ["admission", "unstable-runtime"] }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-prometheus = { workspace = true }
prometheus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# The version the kit is tested with (RFC 0005).
k8s-openapi = { workspace = true, features = ["v1_36"] }
# `start_paused` in the leader-election tests.
tokio = { workspace = true, features = ["test-util"] }
# The scripted apiserver of the lease tests.
rustls = { workspace = true }
wiremock = "0.6"
